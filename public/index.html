<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1011" />
    <meta name="description" content="Biblioteca universal de archivos en tu red local." />
    <title>Cyb3rLab LAN · Biblioteca local</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/theme.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Cyb3rLab LAN, inicio">
          <span class="brand-mark" aria-hidden="true">CL</span>
          <span class="brand-name">Cyb3rLab <span>LAN</span></span>
        </a>
        <div class="connection"><span class="connection-dot"></span> Nodo / local</div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="intro-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span> BIBLIOTECA / NODO 01</p>
            <h1 id="page-title">Tus archivos.<br /><span>Sin límites de formato.</span></h1>
            <p class="intro-note">ALMACENAMIENTO LOCAL <span aria-hidden="true">/</span> CUALQUIER FORMATO <span aria-hidden="true">/</span> HTTP:8080</p>
          </div>
          <div class="intro-stamp" aria-hidden="true">
            <span class="stamp-orbit">LOCAL<br />NODE_01</span>
            <span class="stamp-center">CL</span>
          </div>
        </section>

        <section class="library" aria-labelledby="library-title">
          <div class="section-head">
            <div>
              <p class="eyebrow section-eyebrow">01 <span class="eyebrow-line"></span> STORAGE</p>
              <h2 id="library-title">Archivos</h2>
            </div>
            <p class="package-count" id="file-count" aria-live="polite">Leyendo biblioteca...</p>
          </div>

          <div class="toolbar">
            <label class="search-box">
              <span class="search-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Buscar archivos</span>
              <input id="search" type="search" placeholder="Buscar archivo o carpeta" autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <label class="sort-box">
              <span class="visually-hidden">Ordenar archivos</span>
              <select id="sort">
                <option value="name">Nombre</option>
                <option value="recent">Más recientes</option>
                <option value="size">Tamaño</option>
              </select>
            </label>
            <button class="refresh-button" id="refresh" type="button" title="Actualizar biblioteca" aria-label="Actualizar biblioteca">
              <span aria-hidden="true">&#8635;</span>
            </button>
          </div>

          <div class="catalog-grid" id="catalog" aria-live="polite" aria-busy="true"></div>
          <div class="empty-state" id="empty-state" hidden>
            <span class="empty-mark" aria-hidden="true">0</span>
            <p id="empty-message">La biblioteca está vacía.</p>
          </div>
          <p class="catalog-error" id="catalog-error" hidden></p>
        </section>
      </main>

      <footer class="footer">
        <span>Cyb3rLab LAN <span class="footer-separator">/</span> SOLO RED LOCAL</span>
        <span>BIBLIOTECA LOCAL <span class="footer-separator">/</span> <span id="total-size">0 B</span></span>
      </footer>
    </div>
  </body>
</html>
